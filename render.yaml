services:
  - type: web
    name: vah-health-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: DATABASE_FILE
        value: /var/data/vah-health.db
    disk:
      name: vah-health-data
      mountPath: /var/data
      sizeGB: 1
